# Experanto Edge agent — example configuration.
# Real config lives at /etc/experanto-edge/config.yaml (written by install.sh / --enroll).
# NEVER commit a real config: it contains the device secret.

# --- identity (from enrollment in the Experanto SPA) ---
device_code: "EXP-XXXX-XXXX"     # also the MQTT username
secret: "REPLACE_ME"             # device secret (MQTT password); shown once at enrollment
station_id: ""                   # Experanto station UUID this device feeds

# --- broker ---
broker_host: "mqtt.experanto.it"
broker_port: 8883
tls: true
ca_cert: null                    # path to a CA bundle; null = system trust store
tls_insecure: false              # DEV ONLY — never true in production

# --- local datalogger ---
reader_type: "solarlog_getjp"    # Solar-Log Base 2000 local getjp API
datalogger_ip: ""                # e.g. 192.168.1.50 (auto-discovered if empty)
datalogger_port: 80

# --- behaviour ---
interval: 300                    # seconds between cycles (= worker poll rate)
command_wait: 3.0                # seconds waited for a retained command each cycle
buffer_path: "/var/lib/experanto-edge/buffer.db"
buffer_max_rows: 5000
log_level: "INFO"
health_path: "/var/lib/experanto-edge/health"   # touched each cycle; OTA rollback watches it

# --- OTA (server-initiated, signed releases) ---
# Releases are signed server-side (Ed25519) and served under update_base_url as
#   experanto-edge-<version>.tar.gz  +  experanto-edge-<version>.json (manifest).
# The agent verifies sha256 + signature against update_public_key before the root
# helper installs/swaps/restarts (with automatic rollback).
update_base_url: ""              # e.g. https://mqtt.experanto.it/releases
update_public_key: ""           # base64 of the raw 32-byte Ed25519 public key (from sign_release.py keygen)
app_dir: "/opt/experanto-edge"
ota_helper: "/opt/experanto-edge/ota-helper.sh"

# --- remote SSH (reverse tunnel to a self-hosted bastion — no third-party) ---
# The Pi has no inbound ports (often CGNAT). It keeps an OUTBOUND ssh -R to YOUR bastion,
# exposing its :22 there on `ssh_reverse_port`. On `open_ssh` the agent brings the tunnel
# up for `ssh_default_ttl` seconds, then tears it down. Only openssh (+autossh) + your VPS.
ssh_bastion_host: ""             # your bastion/VPS hostname or IP (empty = SSH remoto disabilitato)
ssh_bastion_port: 22
ssh_bastion_user: "edge-tunnel"  # restricted tunnel account on the bastion
ssh_reverse_port: 0              # UNIQUE bastion port forwarding to this Pi (assegnata per-device)
ssh_local_port: 22               # local sshd port to expose
ssh_identity: "/etc/experanto-edge/tunnel_key"   # private key used to auth to the bastion
ssh_default_ttl: 900             # seconds the tunnel stays up per open_ssh
